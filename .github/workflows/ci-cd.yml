name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: smashmario/cicd-demo

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Run tests inside a temporary container
        run: docker run --rm $IMAGE:${{ github.sha }} python -m pytest -v

      # Each job runs on a fresh machine, so hand the tested image to the next job as a file.
      - name: Save tested image
        run: docker save $IMAGE:${{ github.sha }} -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: tested-image
          path: image.tar
          retention-days: 1

  push-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-image

      - name: Load tested image
        run: docker load -i image.tar

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image (commit tag + latest)
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  demo-run:
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull and start the published image
        run: docker run -d --name demo -p 5000:5000 $IMAGE:${{ github.sha }}

      - name: Wait until ready, then check the response
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && break
            sleep 1
          done
          echo
          body=$(curl -sf http://localhost:5000/)
          echo "Response: $body"
          test "$body" = "CI/CD demo version 1"

      - name: Clean up
        if: always()
        run: docker rm -f demo
